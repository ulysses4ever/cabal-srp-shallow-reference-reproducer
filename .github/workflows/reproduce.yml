name: Reproduce shallow reference bug

on:
  push:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up GHC and cabal
        uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.2"
          cabal-version: "3.16.0.0"

      - name: Run reproducer from a non-git copy
        shell: bash
        run: |
          set -euo pipefail

          workdir=$(mktemp -d)
          cp -a . "$workdir/repro"
          rm -rf "$workdir/repro/.git"
          cd "$workdir/repro"

          if cabal build all -v 2>&1 | tee build.log; then
            echo "Expected cabal build to fail, but it succeeded."
            exit 1
          fi

          grep -F "reference repository" build.log
          grep -F "is shallow" build.log
